name: Lua ScriptLanguage Android build

on:
  push:
    branches:
      - feature/lua-scripting-foundation
  pull_request:
    branches:
      - feature/lua-scripting-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lua-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-template:
    name: Android ${{ matrix.arch }} release template
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm32, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SCons
        run: python -m pip install --upgrade scons

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify Lua ScriptLanguage sources are present
        run: |
          test -f modules/lua/lua_script.h
          test -f modules/lua/lua_script.cpp
          test -f modules/lua/doc_classes/LuaScript.xml
          grep -q 'ScriptServer::register_language' modules/lua/register_types.cpp
          grep -q 'get_recognized_extensions' modules/lua/register_types.cpp

      - name: Build Android release template
        run: scons platform=android target=template_release arch=${{ matrix.arch }} -j2

      - name: Upload Android engine template
        uses: actions/upload-artifact@v4
        with:
          name: nexo-3d-android-${{ matrix.arch }}-template
          path: |
            bin/android/*.android.template_release.${{ matrix.arch }}.so
            bin/android/*.android.template_release.${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
