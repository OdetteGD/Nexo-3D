name: Lua editor smoke test

on:
  push:
    branches:
      - feature/lua-scripting-foundation
  pull_request:
    branches:
      - feature/lua-scripting-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lua-editor-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-smoke:
    name: Build editor and run attached .lua scene
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux editor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev libspeechd-dev libdbus-1-dev libdecor-0-dev libvulkan-dev

      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: python -m pip install --upgrade scons

      - name: Validate native Lua ScriptLanguage wiring
        run: |
          test -f modules/lua/lua_script.h
          test -f modules/lua/lua_script.cpp
          grep -q 'ScriptServer::register_language' modules/lua/register_types.cpp
          grep -q 'get_recognized_extensions' modules/lua/register_types.cpp
          grep -q 'LuaSyntaxHighlighter' modules/lua/register_types.cpp

      - name: Build Godot editor with Lua module
        run: scons platform=linuxbsd target=editor -j2

      - name: Create a test project with an attached Lua script
        run: |
          mkdir -p tests/lua_editor_smoke
          cat > tests/lua_editor_smoke/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="Nexo Lua Editor Smoke"
          run/main_scene="res://main.tscn"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cat > tests/lua_editor_smoke/main.lua <<'EOF'
          function _ready()
              Nexo.log("LUA_EDITOR_SMOKE_READY")
          end

          function _process(delta)
          end
          EOF
          cat > tests/lua_editor_smoke/main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="LuaScript" path="res://main.lua" id="1_lua"]

          [node name="LuaSmokeRoot" type="Node"]
          script = ExtResource("1_lua")
          EOF

      - name: Open project in headless editor and scan .lua resource
        run: |
          bin/godot.linuxbsd.editor.x86_64 --headless --editor --path tests/lua_editor_smoke --quit

      - name: Run scene and assert attached Lua lifecycle callback
        run: |
          output="$(bin/godot.linuxbsd.editor.x86_64 --headless --path tests/lua_editor_smoke --quit-after 2 2>&1)"
          printf '%s\n' "$output"
          printf '%s' "$output" | grep -F 'LUA_EDITOR_SMOKE_READY'

